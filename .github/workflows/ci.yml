name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic heads
        run: python -m alembic heads
      - name: Import smoke
        env:
          JWT_SECRET_KEY: ci-test-secret-not-for-production-use-32chars
          COOKIE_SECURE: "false"
          ENVIRONMENT: development
          DATABASE_URL: postgresql://vetclinic:vetclinic@localhost:5432/vetclinic
        run: |
          python -c "from schemas import DOUBLE_BOOKING_STATUSES, ClinicCreate; from login_guard import get_login_rate_store; get_login_rate_store(); import main; print('ok', DOUBLE_BOOKING_STATUSES, main.app.title)"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
