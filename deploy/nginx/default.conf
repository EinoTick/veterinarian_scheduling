# Edge nginx: TLS termination + SPA + same-origin /api proxy.
#
# Upstream name "api" matches the Compose service name.
# TRUST_PROXY=true on the API so X-Forwarded-* are honored for rate limits.

upstream vetclinic_api {
    server api:8000;
    keepalive 8;
}

# Internal liveness for Docker HEALTHCHECK (HTTP only, no TLS).
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else on :80 redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (baseline; tighten CSP once routes stabilize).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://vetclinic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Auth token endpoint is under /api/auth/... — covered above.
    # Expose readiness for operators/load balancers over TLS.
    location = /health {
        proxy_pass http://vetclinic_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
